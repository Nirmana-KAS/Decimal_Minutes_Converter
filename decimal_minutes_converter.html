<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>450 ÷ Value Time Calculator</title>
<style>
  :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #101010; color: #f4f4f4; }
  .app { width: min(100%, 560px); padding: 26px; border: 1px solid #393939; border-radius: 18px; background: #181818; box-shadow: 0 12px 35px #0005; }
  h1 { margin: 0 0 8px; font-size: 1.45rem; }
  p { margin: 0 0 22px; color: #bdbdbd; line-height: 1.5; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; }
  label { display: block; margin-bottom: 8px; font-weight: 600; }
  input { width: 100%; padding: 13px 14px; border: 1px solid #505050; border-radius: 10px; background: #0e0e0e; color: white; font-size: 1.1rem; outline: none; }
  input:focus { border-color: #b8b8b8; }
  input[readonly] { color: #c9c9c9; background: #252525; }
  .equation { display: flex; align-items: center; justify-content: center; height: 46px; font-size: 1.5rem; color: #bdbdbd; }
  button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px; background: #f2f2f2; color: #111; font-size: 1rem; font-weight: 700; cursor: pointer; }
  button:hover { background: #dcdcdc; }
  .result { margin-top: 20px; padding: 18px; border-radius: 12px; background: #242424; border: 1px solid #383838; }
  .result-label { color: #bdbdbd; font-size: .9rem; }
  #output { margin-top: 7px; font-size: 1.6rem; font-weight: 700; overflow-wrap: anywhere; }
  #detail { margin-top: 8px; color: #c7c7c7; font-size: .95rem; overflow-wrap: anywhere; }
  .error { color: #ffaaaa; margin-top: 10px; min-height: 1.2em; }
  .example { margin-top: 16px; color: #a9a9a9; font-size: .88rem; }
  @media (max-width: 420px) { .fields { grid-template-columns: 1fr; gap: 10px; } .equation { height: 20px; } }
</style>
</head>
<body>
<main class="app">
  <h1>Minutes Calculator</h1>
  <p>Divide the fixed value 450 by your entered value, then convert the decimal-minute result into minutes and seconds.</p>
  <form id="calculator">
    <div class="fields">
      <div>
        <label for="firstValue">First value (fixed)</label>
        <input id="firstValue" type="number" value="450" readonly aria-readonly="true">
      </div>
      <div>
        <label for="secondValue">Second value</label>
        <input id="secondValue" type="number" min="0.000001" step="any" placeholder="Enter value" inputmode="decimal" required autofocus>
      </div>
    </div>
    <button type="submit">Calculate</button>
  </form>
  <div class="error" id="error" role="alert"></div>
  <section class="result" aria-live="polite">
    <div class="result-label">Result (minutes and seconds)</div>
    <div id="output">—</div>
    <div id="detail">Enter a second value and press Calculate.</div>
  </section>
  <div class="example">Example: 450 ÷ 500 = 0.9 decimal minutes = 0 minutes 54 seconds.</div>
</main>
<script>
  const form = document.getElementById('calculator');
  const firstValue = document.getElementById('firstValue');
  const secondValue = document.getElementById('secondValue');
  const output = document.getElementById('output');
  const detail = document.getElementById('detail');
  const error = document.getElementById('error');

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    const first = Number(firstValue.value);
    const second = Number(secondValue.value);
    if (secondValue.value.trim() === '' || !Number.isFinite(second) || second <= 0) {
      error.textContent = 'Please enter a number greater than zero.';
      output.textContent = '—';
      detail.textContent = '';
      return;
    }
    error.textContent = '';
    const decimalMinutes = first / second;
    const totalSeconds = Math.round(decimalMinutes * 60);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    output.textContent = `${minutes} minute${minutes === 1 ? '' : 's'} ${seconds} second${seconds === 1 ? '' : 's'}`;
    detail.textContent = `${first} ÷ ${second} = ${decimalMinutes.toFixed(6)} decimal minutes (${totalSeconds} total seconds)`;
  });
</script>
</body>
</html>
